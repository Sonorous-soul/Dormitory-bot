services:
  - type: web
    name: dormitory-bot
    runtime: python
    pythonVersion: "3.12.3"
    buildCommand: pip install -r requirements.txt
    startCommand: python 5k_dorm.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: PORT
        value: 8080
    envVars:
      - key: BOT_TOKEN
        sync: false
